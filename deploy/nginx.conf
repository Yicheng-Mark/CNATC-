# ============================================================
# CNATC 运动防护网 — Nginx 站点配置
# 用途:托管 React SPA 静态文件
# 放置位置(服务器上):/etc/nginx/conf.d/cnatc.conf
# 放好后执行:nginx -t && systemctl reload nginx
# ============================================================

server {
    listen 80;
    listen [::]:80;

    # ⬇️ 改成你的域名;没有域名先用 _ (匹配所有)
    server_name _;

    # 网站文件根目录(部署脚本会把 dist 内容放到这里)
    root /var/www/cnatc;
    index index.html;

    # ---------- gzip 压缩 ----------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

    # ---------- 带 hash 的 JS/CSS:长期强缓存 ----------
    # Vite 打包后文件名带 hash,内容一变文件名就变,可放心缓存一年
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ---------- 图片/视频/字体:中等缓存 ----------
    location ~* \.(jpg|jpeg|png|gif|webp|avif|ico|svg|mp4|webm|woff2?|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # ---------- SPA 路由回退(关键) ----------
    # react-router 用的是前端路由(如 /progress /academy),
    # 直接刷新这些路径会 404,所以未命中文件时一律返回 index.html。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---------- index.html 不缓存,保证发版即时生效 ----------
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    # 上传/请求体大小限制
    client_max_body_size 20m;

    # 隐藏 nginx 版本号
    server_tokens off;
}
